name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  tests:
    name: Build and run solution tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The solution uses central package management (no packages.lock.json), so the
      # key covers the central versions and the project files which add or remove
      # package references. A changed key falls back to the newest cache of this OS.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/Directory.Packages.props', 'tests/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ci=true skips the local source generators and verifies that the committed
      # generated files match their definitions (see docs/CODING_RULES.md).
      - name: Build the solution
        run: dotnet build src/MUnique.OpenMU.sln -c Release -p:ci=true

      - name: Run the solution tests
        run: dotnet test src/MUnique.OpenMU.sln -c Release -p:ci=true --no-build
